[package]
name = "sid"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# App-shell spike. gpui is published on crates.io since Oct 2025; the pin lives in
# `[workspace.dependencies]` so `sid` and `sid-ui` can never drift. Pre-1.0: expect
# breaking changes between 0.2.x and later. Linux default features pull in
# font-kit + wayland + x11 automatically.
gpui.workspace = true
# The component crate (2026-07-26 UI overhaul): semantic tokens, the cosmos ->
# `gpui_component::ThemeColor` bridge, and every shared widget. A frontend crate, so it
# may name gpui/gpui-component; it depends on no domain crate.
sid-ui.workspace = true
sid-store = { path = "../sid-store" }
sid-secrets = { path = "../sid-secrets" }
# W2 (Database tab, Plan Wave 2): the one crate allowed to name `sid-db`'s concrete
# `DbClient`/`DbClientDescriptor` impls — see `crates/sid/src/db_registry.rs`.
sid-db = { path = "../sid-db" }
# Network tab (inc-1): the one crate allowed to name `sid-sysinfo`'s concrete
# `SysinfoProvider` constructor — see `crates/sid/src/ui/network_tab.rs`. `sysinfo`/
# `netstat2`/`nix` themselves stay behind `sid_core::sys`, never named here.
sid-sysinfo.workspace = true
# Network tab v2 (Services sub-view): the one crate allowed to name `sid-svcctl`'s
# concrete `SvcctlProvider::new()` constructor — same seam shape as `sid-sysinfo`
# above. `systemctl`/subprocess calls themselves stay behind `sid_core::svc`, never
# named here. Not in `[workspace.dependencies]` (a plain path dep, like `sid-store`/
# `sid-db`/`sid-secrets` below already are) — see the root `Cargo.toml`'s `members`.
sid-svcctl = { path = "../sid-svcctl" }
# Network tab v3 (Docker/Kubernetes sub-views): the one crate allowed to name
# `sid-containers`'s concrete `DockerCliProvider::new()` / `KubectlCliProvider::new()`
# constructors — same seam shape as `sid-sysinfo`/`sid-svcctl` above. `docker`/
# `kubectl` themselves stay behind `sid_core::containers`, never named here.
sid-containers.workspace = true
# Adapter crates for Plan 3C (SSH terminal view + connect flow). `crates/sid` only ever
# names the `sid_core` trait seam (`SshClient`/`SshShell`/`TerminalScreen`) plus the two
# concrete-adapter *constructors* (`RusshClientFactory`, `Vt100Screen`) — never `russh`/
# `vt100` themselves.
sid-core.workspace = true
# Privileged (root) config-file reads/writes for the System tab's editor: the one crate
# allowed to name `sid-privfs`'s concrete `SudoPrivilegedFs::new()` constructor — same seam
# shape as `sid-sysinfo`/`sid-svcctl` above. `sudo` itself stays behind
# `sid_core::privfs`, never named here.
sid-privfs.workspace = true
sid-ssh.workspace = true
sid-term.workspace = true
# Workspaces tab (track U): the one crate allowed to name `sid-git`'s concrete
# `Git2Provider` — see `crates/sid/src/git_registry.rs`.
sid-git.workspace = true
# GPU pre-flight: the one crate allowed to name `sid-gpu`'s concrete
# `LinuxGpuPreflight` — same seam shape as `sid-sysinfo`/`sid-svcctl` above. The
# probe/ladder/stamp mechanics themselves stay behind `sid_core::gpu`, never
# named here beyond the constructor + the two protocol modes in `main.rs`.
sid-gpu.workspace = true
# Startup logging: blade/gpui emit real diagnostics through `log` (most
# importantly the exact failing Vulkan call when GPU init breaks) and sid
# previously dropped every record on the floor. Also the `--gpu-probe`
# protocol's stderr channel — the pre-flight parent parses the probe child's
# env_logger-formatted `Adapter:` line.
env_logger = "0.11"
# Grapheme/word segmentation for the TextInput element (cursor movement, masking).
# Already in the tree transitively via gpui; pinned here as a direct dep.
unicode-segmentation = "1"
# Dedicated runtime for the SSH connect/shell actor task (Plan 3C C2): the concrete
# `RusshClient`/`RusshShell` impls assume an ambient Tokio runtime (`tokio::spawn`,
# `tokio::sync::Mutex`) — gpui's own executor is smol-based and provides none. All
# `sid_core::ssh` calls run on this runtime; gpui's executors only bridge status/output
# back to the entity via channels.
tokio.workspace = true
# Widget library for the Database tab (Plan Wave 2, W1): SQL editor (tree-sitter
# highlighting) + results table. GPUI-0.2.2-compatible; validated against dbflux/pgui
# precedent. `crates/sid` names it directly (the rendering surface) — DB drivers
# themselves stay behind `sid_db`/`sid_core::db`, never named here.
gpui-component.workspace = true
# Bundled icon/font assets `gpui-component`'s widgets reference (sort-chevron icons on
# `Table` columns, etc.) — wired in via `Application::new().with_assets(..)`.
gpui-component-assets.workspace = true

[dev-dependencies]
# `app::seed_if_empty`'s tests (perf audit finding #7) need a real, throwaway `Store`
# on disk — same pattern `sid-store`/`sid-db` already use in their own tests.
tempfile.workspace = true
