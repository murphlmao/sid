[package]
name = "sid-ui"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# sid-ui is a FRONTEND crate: naming `gpui` / `gpui-component` here is allowed and
# correct (CLAUDE.md rule 1 — "GPUI may be named only in frontend crates"). It is the
# rendering surface's adapter layer: it owns the semantic tokens, the cosmos ->
# `gpui_component::ThemeColor` bridge, and every shared widget. It must NOT depend on
# `sid-core`/`sid-store`/any domain crate — it knows colors and pixels, nothing else.
gpui.workspace = true
gpui-component.workspace = true
# `focus.rs` only — `active_focus_trap`, which `gpui-component` uses in its own `Root`
# but does not re-export.
gpui-base.workspace = true
# The icon registry (`icon.rs`) resolves every `Icon` variant through the complete
# Lucide catalog rather than `gpui-component`'s 86-icon compatibility subset, so it
# needs the assets crate itself, not just `gpui-component`'s re-export of its trait.
gpui-kit-assets.workspace = true
# `input::words` — sid's word-boundary rule (ctrl-backspace / ctrl-shift-arrow), stated
# over UAX#29 segments rather than over `char`s, so a run of CJK, an accented cluster or
# a ZWJ emoji sequence is one unit instead of several. Same crate the library's own
# `InputState` uses, so the two cannot disagree about where a word ends.
unicode-segmentation.workspace = true
