[workspace]
resolver = "3"
members = [
    "crates/sid",
    "crates/sid-ui",
    "crates/sid-secrets",
    "crates/sid-store",
    "crates/sid-core",
    "crates/sid-term",
    "crates/sid-ssh",
    "crates/sid-db",
    "crates/sid-git",
    "crates/sid-gpu",
    "crates/sid-sysinfo",
    "crates/sid-svcctl",
    "crates/sid-containers",
    "crates/sid-privfs",
    "crates/sid-mcp",
    "crates/sid-os",
]

[workspace.package]
edition = "2024"
# The real floor, not an aspiration: sysinfo 0.39+ declares 1.95, so nothing older
# could build sid anyway. It also steers the v3 resolver, which skips any release
# whose own rust-version is newer than this — at 1.85 it was quietly holding back
# patch releases (elliptic-curve, ssh-key's stack) that every other pin allowed.
rust-version = "1.95"
license = "GPL-3.0-only"
authors = ["Murphy Malcolm"]
repository = "https://github.com/murphlmao/sid"

[workspace.dependencies]
# Internal crates (versionless path deps; never published).
sid-core = { path = "crates/sid-core" }
sid-ui = { path = "crates/sid-ui" }
sid-term = { path = "crates/sid-term" }
sid-ssh = { path = "crates/sid-ssh" }
sid-store = { path = "crates/sid-store" }
sid-git = { path = "crates/sid-git" }
sid-gpu = { path = "crates/sid-gpu" }
sid-sysinfo = { path = "crates/sid-sysinfo" }
sid-containers = { path = "crates/sid-containers" }
sid-privfs = { path = "crates/sid-privfs" }
sid-os = { path = "crates/sid-os" }

# SSH — russh 0.65 (keys live in `russh::keys`; the standalone russh-keys crate
# is obsolete and was dropped). Must stay >=0.61 to clear RUSTSEC-2026-0153/0154
# (CryptoVec allocation hardening). russh-sftp is version-independent of russh.
russh = "0.65"
russh-sftp = "3"

# Desktop notifications (`sid-os`): org.freedesktop.Notifications over the blocking zbus
# API; same zbus 5 line already in the lock via sid-secrets.
zbus = { version = "5.16", default-features = false, features = ["async-io", "blocking-api"] }

# Terminal emulation — vt100 0.18 parses the SSH shell byte stream into a
# styled cell grid that the GPUI terminal view (Plan 3C) renders 1:1.
vt100 = "0.18"

# Database clients (Track DA, `sid-db`) — tokio-postgres = "0.7", the standard
# async Postgres driver; rusqlite = { features = ["bundled", "column_decltype"] },
# embedded SQLite that ships its own C source (no system SQLite install needed),
# with column_decltype exposing declared column types for the type mapping.
tokio-postgres = "0.7"
rusqlite = { version = "0.41", features = ["bundled", "column_decltype"] }

# DU-TLS: Postgres TLS, pure-Rust rustls stack (the lock resolves tokio-postgres
# 0.7.18 + rustls 0.23.46 + tokio-postgres-rustls 0.14.0 + rustls-native-certs 0.8.5
# together with no conflicts; rustls 0.24 is still a pre-release, so 0.23 is the
# newest line). `ring` chosen over the default `aws_lc_rs` provider to
# avoid a cmake/nasm build dependency; rustls needs one crypto provider
# installed process-wide (installed once, idempotently, at connect time).
tokio-postgres-rustls = { version = "0.14", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"

# Typed Postgres value decoding (`sid-db`'s `render_pg_value`, integration-probe
# fix — see docs/design bug log): tokio-postgres's `with-*` features (enabled on
# the `tokio-postgres` dependency in `crates/sid-db/Cargo.toml`) decode UUID/
# timestamp/JSON columns through these crates instead of falling through to a
# `String` decode that silently renders a present value as "NULL". `rust_decimal`'s
# `db-tokio-postgres` feature is the NUMERIC decode path (matched against our
# pinned tokio-postgres "0.7" line above).
uuid = "1"
chrono = "0.4"
serde_json = "1"
rust_decimal = { version = "1", features = ["db-tokio-postgres"] }

# Async
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

# Network tab (`sid-sysinfo`) — process/interface/socket enumeration + signal delivery.
# sysinfo is HELD at 0.39 (latest 0.40): 0.40 makes every constructor and static query
# fallible (`System::new()`, `Networks`/`Users::new_with_refreshed_list()`, `uptime()`,
# `load_average()` all return `Result`) and drops `Users::list()`, which reaches past
# compile fallout into `SysinfoProvider::new()`'s infallible public signature — a
# design call for whoever next owns this crate, not a version bump. 0.39 is also what
# sets the workspace rust-version (1.95).
sysinfo = { version = "0.39", default-features = false, features = ["system", "network", "disk", "user"] }
netstat2 = "0.11"
nix = { version = "0.31", features = ["signal", "process"] }

# Errors / serialization shared by the adapter seam
thiserror = "2"
serde = { version = "1", features = ["derive"] }

# `sid-secrets`' dependency-less encrypted-file vault backend (a peer to the OS
# keyring): argon2id KDF + XChaCha20-Poly1305 AEAD + `Zeroizing` to wipe the derived
# key on drop. All pure-Rust RustCrypto crates — no system library dependency, which is
# the whole point of this backend. `argon2` 0.6 is the first stable release of the line
# `ssh-key` (russh's key-parsing dep) asks for with `^0.6.0-rc.8`, so both resolve to one
# argon2 in the lock; `getrandom` 0.4 likewise reuses a line already resolved
# transitively, for salt/nonce generation rather than pulling in a full `rand`
# dependency. The KDF parameters and the sealed-file format are sid's own (see
# `sid-secrets/src/file.rs`) and do not move with these versions.
argon2 = { version = "0.6", default-features = false, features = ["alloc"] }
chacha20poly1305 = "0.11"
getrandom = "0.4"
zeroize = "1"

# Rendering surface. Single-sourced here (rather than in each frontend crate) so the
# `sid` binary and the `sid-ui` component crate can never drift apart on the pin, and
# so the gpui-pre 0.3 / gpui-component 0.6 migration was in fact one block. Only
# frontend crates (`sid`, `sid-ui`) may depend on these — see CLAUDE.md rule 1.
# The pre-release line (`gpui-pre` 0.3.x, a crates.io snapshot of zed's `main`) split
# the windowing/rendering backends out of `gpui` into `gpui_platform`, and replaced the
# monolithic `Application::new()` with `gpui_platform::application()`. The platform
# feature set is copied verbatim from gpui-component's own workspace so sid and the
# widget library agree on one build of the renderer.
# gpui-component 0.9 pins `gpui-pre` with `=0.3.11` (zed snapshot f816e1f), so the
# renderer pin is exact here too: a looser `0.3` would let a future 0.3.x resolve for
# sid while gpui-component holds 0.3.11, which cargo refuses rather than unifies.
gpui = { package = "gpui-pre", version = "=0.3.11" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.11", features = ["font-kit", "runtime_shaders"] }
gpui-component = { version = "0.9.0", features = ["tree-sitter-languages"] }
# The unstyled half of gpui-component, which the 0.6 split carved out. Already in the
# lock as gpui-component's own dependency; named here for the one API the styled crate
# does not re-export — `active_focus_trap`, the query behind `gpui_component::Root`'s
# Tab handler and behind `sid_ui::focus`, which has to ask the same question.
gpui-base = "0.9.0"
# The icon/asset crate was renamed `gpui-component-assets` -> `gpui-kit-assets` in 0.6.
gpui-kit-assets = "0.9.0"
# Grapheme and word segmentation (UAX#29). Single-sourced for the same reason as the
# renderer: `sid-ui`'s word-boundary rule has to be the *same* rule `gpui-component`'s
# `InputState` applies to ctrl-backspace, and a second major version in the lock would
# quietly make them two rules.
unicode-segmentation = "1"

# Test
tempfile = "3"
proptest = "1"

# Lean dev builds. Full debuginfo for ~1070 dependency crates is most of a ~13 GB
# target dir and most of link time and linker RAM — and parallel agent worktrees each
# carry their own target dir. Line tables keep backtraces readable for sid's own
# crates; dependencies drop debuginfo entirely. A debugger session that needs more can
# override per-invocation: `CARGO_PROFILE_DEV_DEBUG=full cargo build`.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
